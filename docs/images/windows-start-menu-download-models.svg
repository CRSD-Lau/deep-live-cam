<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Windows Start Menu search for Download and Verify Models</title>
  <desc id="desc">Illustration showing the Windows Start Menu search box with Download and Verify Models typed, and the matching app shortcut highlighted.</desc>
  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6ec8"/>
      <stop offset="0.45" stop-color="#18245d"/>
      <stop offset="1" stop-color="#b31ab7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252b43"/>
      <stop offset="1" stop-color="#442047"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1280" height="520" fill="url(#wallpaper)"/>
  <path d="M0 120 C180 20 310 200 500 80 C670 -30 805 80 990 38 C1110 10 1200 45 1280 0 L1280 520 L0 520 Z" fill="#071127" opacity="0.38"/>
  <path d="M1010 0 C960 120 1080 210 1030 330 C1000 405 1040 475 1120 520 L1280 520 L1280 0 Z" fill="#f12bd7" opacity="0.45"/>

  <g filter="url(#shadow)">
    <rect x="150" y="54" width="980" height="412" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="190" y="84" width="900" height="44" rx="22" fill="#1c1b2b" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="218" cy="106" r="8" fill="none" stroke="#34c3ff" stroke-width="3"/>
    <line x1="224" y1="112" x2="232" y2="120" stroke="#34c3ff" stroke-width="3" stroke-linecap="round"/>
    <text x="248" y="112" fill="#f4f6fb" font-family="Segoe UI, Arial, sans-serif" font-size="17">Download and Verify Models</text>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
      <rect x="190" y="156" width="52" height="38" rx="19" fill="#48bdfb"/>
      <text x="216" y="180" text-anchor="middle" fill="#092136">All</text>
      <rect x="254" y="156" width="72" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="290" y="180" text-anchor="middle" fill="#f4f6fb">Apps</text>
      <rect x="338" y="156" width="126" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="401" y="180" text-anchor="middle" fill="#f4f6fb">Documents</text>
      <rect x="476" y="156" width="74" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="513" y="180" text-anchor="middle" fill="#f4f6fb">Web</text>
      <rect x="562" y="156" width="92" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="608" y="180" text-anchor="middle" fill="#f4f6fb">Settings</text>
    </g>

    <text x="190" y="240" fill="#f4f6fb" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Best match</text>
    <rect x="190" y="260" width="420" height="78" rx="3" fill="#ffffff" fill-opacity="0.13"/>
    <rect x="190" y="260" width="4" height="78" rx="2" fill="#3abdfb"/>
    <circle cx="222" cy="299" r="16" fill="#15151c"/>
    <rect x="215" y="289" width="14" height="20" rx="3" fill="#d4433a"/>
    <circle cx="222" cy="285" r="6" fill="#f2c6a5"/>
    <text x="260" y="294" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Download and Verify Models</text>
    <text x="260" y="322" fill="#d7d9e6" font-family="Segoe UI, Arial, sans-serif" font-size="15">App</text>

    <rect x="650" y="210" width="400" height="200" rx="12" fill="#ffffff" fill-opacity="0.09"/>
    <circle cx="850" cy="267" r="24" fill="#15151c"/>
    <rect x="840" y="250" width="20" height="30" rx="4" fill="#d4433a"/>
    <circle cx="850" cy="244" r="9" fill="#f2c6a5"/>
    <text x="850" y="326" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Download and Verify Models</text>
    <text x="850" y="358" text-anchor="middle" fill="#d7d9e6" font-family="Segoe UI, Arial, sans-serif" font-size="17">App</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="188" y="414" width="904" height="1" fill="#ffffff" opacity="0.16"/>
    <text x="640" y="448" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">After installing, search Windows for "Download and Verify Models" and open that app shortcut.</text>
  </g>
</svg>
