version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Halifax
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Runtime changes must update custom CUDA/DirectML locks, bundled licence
    # evidence, packaged assets, and sometimes physical hardware validation.
    # Keep automated version PRs to tools the bot can update coherently;
    # runtime vulnerabilities remain visible through Dependabot alerts and CI.
    allow:
      - dependency-name: pip
      - dependency-name: pip-tools
      - dependency-name: setuptools
      - dependency-name: wheel
      - dependency-name: pyinstaller
      - dependency-name: pyinstaller-hooks-contrib
      - dependency-name: bandit
      - dependency-name: pip-audit
      - dependency-name: pytest
      - dependency-name: ruff
    groups:
      windows-build-toolchain:
        patterns:
          - "pip"
          - "wheel"
          - "pyinstaller"
          - "pyinstaller-hooks-contrib"
    ignore:
      # pip 26.2 removes an internal API still imported by pip-tools 7.6.0.
      # Revisit when pip-tools publishes a compatible release.
      - dependency-name: pip
        versions:
          - "26.2"
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Halifax
    open-pull-requests-limit: 5
    labels:
      - dependencies
