name: Windows DirectML Test Build

on:
  workflow_dispatch:

jobs:
  build-directml:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-locks/windows-directml-py311.lock

      - name: Build DirectML portable bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\windows\build_windows.ps1 -Python python -Accelerator DirectML

      - name: Validate portable bundle structure
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\windows\test_packaged_runtime.ps1 -Accelerator DirectML

      - name: Upload DirectML test bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeepLiveCamStudio-DirectML-${{ github.sha }}
          path: dist/DeepLiveCamStudio-DirectML/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
