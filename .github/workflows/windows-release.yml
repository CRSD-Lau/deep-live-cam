name: Windows Release Candidate Build

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Installer version"
        required: true
        default: "2.2.0"
      git_ref:
        description: "Git ref used for corresponding-source packaging"
        required: false
        default: ""

jobs:
  build-windows:
    needs: build-directml
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build-windows-cuda.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build, package, and verify release candidate
        shell: pwsh
        run: |
          $gitRef = "${{ inputs.git_ref }}"
          if (-not $gitRef) {
            $gitRef = "${{ github.sha }}"
          }
          powershell -ExecutionPolicy Bypass -File build\windows\run_release_checks.ps1 -AppVersion "${{ inputs.app_version }}" -Python python -GitRef $gitRef -AllowDirtySource

      - name: Guard against accidental publish approval
        shell: pwsh
        run: |
          $strictArgs = @(
            "tools\generate_windows_release_verification.py",
            "--repo-root", ".",
            "--dist", "dist\DeepLiveCamStudio",
            "--output-dir", "build\windows\installer",
            "--app-version", "${{ inputs.app_version }}",
            "--output", "RELEASE_VERIFICATION.md",
            "--require-publish-ready"
          )
          $strict = Start-Process -FilePath "python" -ArgumentList $strictArgs -NoNewWindow -Wait -PassThru
          if ($strict.ExitCode -eq 0) {
            throw "Hosted CI unexpectedly marked this build publish-ready. Final release approval must be performed with the documented manual gates."
          }
          if ($strict.ExitCode -ne 1) {
            throw "Strict verifier failed unexpectedly with exit code $($strict.ExitCode)."
          }
          Write-Host "Hosted CI release-candidate build is not publish-ready by design. Complete the clean VM, OBS, legal, and strict local publish gates before publishing."

      - name: Validate uploaded artifact set
        shell: pwsh
        run: python tools\validate_windows_release_artifacts.py --repo-root . --output-dir build\windows\installer --app-version "${{ inputs.app_version }}" --require-git-ref-source

      - name: Download DirectML release asset
        uses: actions/download-artifact@v4
        with:
          name: DeepLiveCamStudio-${{ inputs.app_version }}-DirectML-x64-portable
          path: build/windows/portable

      - name: Assemble GitHub Release asset set
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\windows\assemble_release_assets.ps1 -AppVersion "${{ inputs.app_version }}" -PortableDir build\windows\portable -RequireGitRefSource

      - name: Validate GitHub Release asset set
        shell: pwsh
        run: python tools\validate_windows_release_artifacts.py --repo-root . --output-dir build\windows\installer --release-assets-dir build\windows\release-assets\${{ inputs.app_version }} --app-version "${{ inputs.app_version }}" --require-git-ref-source --require-directml-portable

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepLiveCamStudio-${{ inputs.app_version }}-x64-setup
          path: |
            build/windows/release-assets/${{ inputs.app_version }}/*
          if-no-files-found: error
          include-hidden-files: true

  build-directml:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-directml.txt

      - name: Build DirectML portable bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\windows\build_windows.ps1 -Python python -Accelerator DirectML

      - name: Package and verify DirectML release asset
        shell: pwsh
        # GitHub-hosted runners have no DirectML display adapter. Structure and
        # non-GPU runtime checks still run here; hardware evidence is a separate
        # manual publication gate.
        run: powershell -ExecutionPolicy Bypass -File build\windows\package_portable.ps1 -AppVersion "${{ inputs.app_version }}" -Accelerator DirectML -SkipAcceleratorProbe

      - name: Upload DirectML release artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepLiveCamStudio-${{ inputs.app_version }}-DirectML-x64-portable
          path: |
            build/windows/portable/DeepLiveCamStudio-${{ inputs.app_version }}-DirectML-x64-portable.zip
            build/windows/portable/DeepLiveCamStudio-${{ inputs.app_version }}-DirectML-x64-portable.zip.sha256
          if-no-files-found: error
          include-hidden-files: true
