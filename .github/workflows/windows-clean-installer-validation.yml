name: Windows Clean Installer Validation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-published-bytes:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the original 2.2.5 candidate installer from its build run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FAILED-DIAGNOSTIC-DeepLiveCamStudio-2.2.5-40251832647-1
          run-id: 40251832647
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dlc-candidate

      - name: Download the published 2.2.4 installer
        shell: pwsh
        run: |
          $url = 'https://github.com/CRSD-Lau/deep-live-cam/releases/download/v2.2.4/DeepLiveCamStudio-2.2.4-x64-setup.exe'
          $output = Join-Path $env:RUNNER_TEMP 'DeepLiveCamStudio-2.2.4-x64-setup.exe'
          & curl.exe --fail --location --retry 3 --silent --show-error --output $output $url
          if ($LASTEXITCODE -ne 0) { throw "Published 2.2.4 download failed with exit code $LASTEXITCODE." }

      - name: Verify the exact downloads and exercise clean installation and upgrade
        shell: pwsh
        run: |
          $candidateFiles = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'dlc-candidate') -Recurse -File -Filter 'DeepLiveCamStudio-2.2.5-x64-setup.exe')
          if ($candidateFiles.Count -ne 1) { throw "Expected exactly one original 2.2.5 installer, found $($candidateFiles.Count)." }
          $previous = Join-Path $env:RUNNER_TEMP 'DeepLiveCamStudio-2.2.4-x64-setup.exe'
          $output = Join-Path $env:RUNNER_TEMP 'dlc-clean-validation'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'build\windows\verify_clean_hosted_release.ps1' -PreviousInstaller $previous -CandidateInstaller $candidateFiles[0].FullName -OutputDir $output
          if ($LASTEXITCODE -ne 0) { throw "Clean installer validation failed with exit code $LASTEXITCODE." }

      - name: Retain the validation receipt and process logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeepLiveCamStudio-2.2.5-clean-hosted-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/dlc-clean-validation/*
          if-no-files-found: warn
          retention-days: 7
